[project]
name = "c1-sensor-quality"
version = "0.1.0"
description = "C1 sensor quality and data validation service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"
