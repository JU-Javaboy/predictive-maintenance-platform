[project]
name = "predictive-maintenance-platform"
version = "0.1.0"
description = "AI-enabled predictive maintenance platform"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "ipykernel>=6.29.0",
    "matplotlib>=3.9.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "seaborn>=0.13.0",
]

[tool.uv.workspace]
members = ["services/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "services/c1-sensor-quality/src",
]

[tool.ruff]
line-length = 100
target-version = "py312"
